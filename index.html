<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stopwatch" />
    <meta name="description" content="A to-do list with a stopwatch for the work in your notebook." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Stopwatch</title>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('productivity-stopwatch-v1'))
        if (saved?.theme === 'light' || saved?.theme === 'dark') {
          document.documentElement.dataset.theme = saved.theme
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            'content',
            saved.theme === 'light' ? '#f3f0ea' : '#0e0f12',
          )
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
